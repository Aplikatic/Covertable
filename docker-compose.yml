services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      APP_NAME: Covertable
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: https://cliente.covertable.es
      APP_KEY: ${APP_KEY}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      MAIL_MAILER: resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM_ADDRESS: pedidos@covertable.es
      MAIL_FROM_NAME: Covertable

      QUEUE_CONNECTION: database
      CACHE_DRIVER: file
      SESSION_DRIVER: file

    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  storage_data:
  db_data:
