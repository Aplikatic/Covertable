user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64M;

    # Widget routes are embeddable in any third-party site; the rest of the
    # app keeps SAMEORIGIN to mitigate clickjacking. The regex matches /widget
    # and /widget/* but not /widget.js or /widget-demo.html.
    map $request_uri $cov_xframe {
        default                  "SAMEORIGIN";
        "~^/widget(/|$|\?)"      "";
    }
    map $request_uri $cov_csp {
        default                  "";
        "~^/widget(/|$|\?)"      "frame-ancestors *;";
    }

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        add_header X-Frame-Options $cov_xframe always;
        add_header Content-Security-Policy $cov_csp always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
